name: Temporary Jekyll Build Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Verify output
        run: |
          echo "== _site root =="
          ls _site
          echo "== publications =="
          ls _site/publications
          echo "== publication entries =="
          ls _site/publication
          test -f _site/index.html && echo "index.html OK"
          test -f _site/publications/index.html && echo "publications/index.html OK"
